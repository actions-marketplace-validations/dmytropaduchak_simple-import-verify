name: Simple Import Verify
description: Warn when new imports reference packages not listed in the project manifest.
author: Dmytro Paduchak
branding:
  icon: download
  color: blue
inputs:
  github-token:
    description: Token to read PR/repo data and post sticky comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail when findings match."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
